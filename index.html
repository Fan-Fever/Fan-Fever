<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fan Fever - Links</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="imagenes/logo-circular.png">
<link rel="stylesheet" href="estilos/estilos.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

</head>
<body>

  <div class="container">
    <!-- LOGO -->
    <div class="logo-container">
      <img src="imagenes/logo-final.jpeg" alt="FAN FEVER Logo" class="logo-img" />
    </div>

    <!-- DESCRIPCIÓN -->
    <p class="description">
      ¡Somos FAN FEVER! <br /> Hecho para fans como vos.💫<br>
      Visita nuestro catálogo!
    </p>

    <!-- ENLACES CON OPCIONES IDÉNTICAS A LA IMAGEN -->
    <div class="links-list">

      <!-- 1. TIENDA ONLINE -->
      <a href="catalogo.html" target="_blank" class="link-card">
        <div class="link-icon-box">
          <!-- Icono miniatura de tu logo -->
          <img src="imagenes/logo-final.jpeg" alt="Logo mini" />
        </div>
        <span class="link-text">CATÁLAGO</span>
      </a>

      <!-- 2. WHATSAPP CONSULTAS -->
      <a href="https://wa.me/5491178942794" target="_blank" class="link-card">
        <div class="link-icon-box" style="background: #25D366; color: white;">
          <i class="fab fa-whatsapp"></i>
        </div>
        <span class="link-text">CONSULTAS</span>

      </a>

      <!-- 3. INSTAGRAM -->
      <a href="https://www.instagram.com/fanfever__?utm_source=ig_web_button_share_sheet&stkn=ZDNlZDc0MzIxNw==" target="_blank" class="link-card">
        <div class="link-icon-box" style="background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); color: white;">
          <i class="fab fa-instagram"></i>
        </div>
        <span class="link-text">INSTAGRAM</span>

      </a>

      <!-- 4. TIKTOK -->
      <a href="https://tiktok.com/@tu-usuario" target="_blank" class="link-card">
        <div class="link-icon-box" style="background: #000; color: white;">
          <i class="fab fa-tiktok"></i>
        </div>
        <span class="link-text">Tik Tok</span>

      </a>

    </div>
  </div>

</body>
</html>
